<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Loja</title>
</head>

<body>
  <header class="capa">
    <h1 class="titulo">Loja Estilo &amp; Design</h1>
    <nav class="painel">
      <a href="index.html" class="menu-link">Início</a>
      <a href="nossos-produtos" class="menu-link">Produtos</a>
      <a href="#contatos" class="menu-link">Contatos</a>
    </nav>
  </header>
  <main>
    <p class="promo invisivel">promoção encerrada!</p>
    <section class="vitrine">
      <h2 id="nossos-produtos">Nossos Produtos</h2>
      <div class="produto">
        <h3>Tênis básico</h3>
        <figure>
          <img src="tenis.jpg" alt="Tênis básico">
          <figcaption class="preco">
            <legend>R$ 99,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
      <div class="produto">
        <h3>Camisa básica</h3>
        <figure>
          <img src="camisabasica.jpg" alt="Camisa básica">
          <figcaption class="preco promo">
            <legend class="preco-antigo">R$ 99,90</legend>
            <legend class="preco-novo">R$ 79,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
      <div class="produto">
        <h3>Calça básica</h3>
        <figure>
          <img src="calcabasica.jpg" alt="Calça básica">
          <figcaption class="preco">
            <legend >R$ 199,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
      <div class="produto">
        <h3>Casaco básico</h3>
        <figure>
          <img src="casaco.jpg" alt="Casaco básico">
          <figcaption class="preco">
            <legend>R$ 299,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
      <div class="produto">
        <h3>vestido</h3>
        <figure>
          <img src="vestido.jpg" alt="vestido">
          <figcaption class="preco">
            <legend>R$ 99,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
      <div class="produto">
        <h3>Boné</h3>
        <figure>
          <img src="boné.jpg" alt="boné">
          <figcaption class="preco">
            <legend>R$ 99,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
      <div class="produto">
        <h3>Chinelo básico</h3>
        <figure>
          <img src="chinelo.jpg" alt="Chinelo básico">
          <figcaption class="preco">
            <legend>R$ 99,90</legend>
          </figcaption>
        </figure>
        <button class="btn-comprar">Comprar</button>
      </div>
    </section>
  </main>
<aside class="carrinho" aria-label="Carrinho de compras">
    <span class="carrinho-icone">🛒</span>
    <span>Carrinho</span>
    <strong class="carrinho-quantidade">0</strong>
  </aside>
  <h2 id="contatos">Contatos</h2>
  <div class="redes-sociais">
  <a href="http://instagram.com"><img src="instagram.png" alt="Instagram"></a>
  <a href="http://facebook.com"><img src="facebook.png" alt="Facebook"></a>
  </div>
  <footer>
    <p>Loja fictícia para atividade de displays.</p>
  </footer>
</body>

</html>
